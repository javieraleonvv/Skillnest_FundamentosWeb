<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javiera Leon">
    <link rel="stylesheet" href="static/css/style.css">

    <title>Taco palace</title>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img id="icono" src="static/images/logo.png">
            <h1> <span class="rojita">Taco</span> Palace
            </h1>
        </div>
        <div class="correo">
            <input type="email" placeholder="email" name="email">
            <button class="inicio">Login</button>
            <img src="static/images/carrito.png" alt="carrito">
            <p> <span id="">0</span></p>
        </div>


    </header>
    <main class="container">
        <section class="contenedor-banner">
            <div class="plato">
                <img id="imagen" src="static/images/enchiladas.jpg">
                <h3>Enchiladas</h3>
            </div>

            <div class="plato">
                <img id="img_plato" src="static/images/tacos.jpg">
                <h3>Tacos</h3>
            </div>

            <div class="plato">
                <img id="img_plato" src="static/images/flautas.jpg">
                <h3>flautas</h3>
            </div>

            <div class="plato">
                <img id="img_plato" src="static/images/gorditas.jpg">
                <h3>Gorditas</h3>
            </div>

            <div class="plato">
                <img id="img_plato" src="static/images/tostadas.jpg">
                <h3>Tostadas</h3>
            </div>

            <div class="plato">
                <img id="img_plato" src="static/images/enfrijoladas.jpg">
                <h3>enfrijoladas</h3>
            </div>
        </section>

        <div class="contenedor-general">
            <section class="seccion-izquierda">
                <div class="principal">
                    <h1>la mejor
                        variedad en
                        platillos de
                        comida
                        <span class="Negrita">Mexicana</span>
                    </h1>
                    <h3>
                        contamos con <a href="#">Servicio</a> a
                        <span class="rojita">
                            domicilio</span>
                    </h3>
                </div>
                <img class="imagen-principal" id="demostracion" src="static/images/comida-mexicana.jpg">


            </section>
            <section class="seccion-derecha">
                <div class="barra">
                    <h3>
                        <span class="negrita2">Recomendados:</span>
                    </h3>
                </div>
                <div class="platilloselregreso">
                    <img src="static/images/orden-tacos.jpg" id="orden-tacos" alt="img-principal">
                    <div class="contenedor-orden">
                        <div class="contenedor-derecha">
                            <h2>Orden de Tacos</h2>
                            <a href="#">Ver Más</a>
                        </div>
                        <div class="contenedor-boton">
                            <button class="botonRedondo">+</button>
                        </div>
                    </div>

                </div>
                <div class="platilloselregreso">
                    <img src="static/images/orden-flautas.jpg" id="orden-flautas">

                    <div class="contenedor-orden">
                        <div class="contenedor-derecha">
                            <h2>Orden de Flautas</h2>
                            <a href="#">Ver Más</a>
                        </div>
                        <div class="contenedor-boton">
                            <button class="botonRedondo">+</button>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
