<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javiera Leon">
    <link rel="stylesheet" href="static/css/style.css">

    <title>Taco palace</title>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img id="icono" src="static/images/logo.png">
            <h1> <span class="rojita">Taco</span> Palace
            </h1>
        </div>
        <div class="correo">
            <input type="email" placeholder="email" name="email">
            <button class="inicio">Login</button>
            <img src="static/images/carrito.png" alt="carrito">
            <p> <span id="">0</span></p>
        </div>


    </header>
    <main class="container">
        <section class="contenedor-izquierda">
            <div class="tarjeta">
                <div class="plato1">
                    <img id="imagen" src="static/images/enchiladas.jpg">
                    <h3>Enchiladas</h3>
                </div>

                <div class="plato2">
                    <img id="imagen2" src="static/images/tacos.jpg">
                    <h3>Tacos</h3>
                </div>

                <div class="plato3">
                    <img id="imagen3" src="static/images/gorditas.jpg">
                    <h3>Gorditas</h3>
                </div>

                <div class="plato4">
                    <img id="imagen4" src="static/images/tostadas.jpg">
                    <h3>Tostadas</h3>
                </div>

                <div class="plato5">
                    <img id="imagen5" src="static/images/enfrijoladas.jpg">
                    <h3>enfrijoladas</h3>
                </div>
            </section>
        </div>

        <div class="contenedor-derecha">
            <section class="inferior">
                <div class="principal">
                    <h1>la mejor
                        variedad en
                        platillos de
                        comida
                        <span class="Negrita">Mexicana</span>
                    </h1>
                    <h2>
                        contamos con <a href="#">Servicio</a> a <span class="rojita">domicilio</span>
                    </h2>
                    <img id="demostracion" src="">
                </div>
            </section>
            <section class="barra-lateral">
                <div class="barra">

                    <h3>
                        <span class="negrita2">Recomendados</span>
                    </h3>
                </div>

                <div class="platilloselregreso">
                    <h2>Orden de Tacos</h2>
                    <a href="#">Ver Más</a>
                    <button class="botonRedondo">+</button>
                </div>
                <div platilloselregreso2>
                    <h2>Orden de Flautas</h2>
                    <a href="#">Ver Más</a>
                    <button class="botonRedondo">+</button>


                </div>






            </section>
        </div>




    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
