<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarjeta de usuario</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="tarjeta_usuario">
        <div class="bloque">
            <h1>lisa simpson</h1>
            <p>Desarrolladora Web</p>
        </div>
        <div class="bloque">
            <p class="descripcion">
                Apasionada por el diseño web y la tecnología.
                Siempre en busca de nuevos retos</p>
            <div class="links">
                <a href="#">GitHub</a>
                <a href="#">Linkedln</a>
            </div>
            <button class="boton">Conectar</button>
            <div class="imagen">
                <img src="static/images/lisa_simpson.png" alt="lisa_simpson">
            </div>

        </div>
    </div>
</body>

</html>
