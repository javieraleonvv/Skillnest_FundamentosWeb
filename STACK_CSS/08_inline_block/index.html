<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="javiera leon">
    <title>Ejemplo mini-sitio inline-bloc</title>
    <link  rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="header">
        <h1>Mi sitio Web</h1>
        <nav class="menu">
            <a href="#" class="boton">Inicio</a>
            <a href="#" class="boton">Servicio</a>
            <a href="#" class="boton">Contactos</a>
        </nav>
    </header>
    <main class="contenedor_principal">
        <!-- Texto con elementos inline -->
        
        <section><h2>texto con elementos online</h2>
        <p>
            este texto es un ejemplo donde usamos <span class="resaltado" inline></span> para resaltar
            texto sin romper la linea de parrafo
        </p>
        </section>
        <!--tarjetas (inline-block)-->
        <section class="contenedor_tarjetas">
            <h2>tarjetas (inline-block)</h2>
            <div class="box">Tarjeta 1</div>
            <div class="box">Tarjeta 2</div>
            <div class="box">Tarjeta 3</div>
        </section>
        <!--bloques (block)-->
        <section>
            <h2>bloques (block)</h2>
            <div class="bloque">Bloque 1</div>
            <div class="bloque">Bloque 2</div>
            <div class="bloque">Bloque 3</div>
        </section>
    </main>
    <!--Footer-->
    <footer class="footer">
        <p>2026 - Todos los derechos reservados</p>
    </footer>
</body>
</html>
