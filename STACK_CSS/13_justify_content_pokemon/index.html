<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justificar contenido con flexbox</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="container">
        <h2>justify-content: flex-start</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
    <div class="container">
        <h2>justify-content: center</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
    <div class="container">
        <h2>justify-content: flex-end</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
    <div class="container">
        <h2>justify-content: space-between</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
    <div class="container">
        <h2>justify-content: space-around</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
    <div class="container">
        <h2>justify-content: space-evelyn</h2>
        <img src="static/images/bulbasaur.png" alt="Pikachu">
        <img src="static/images/pikachu.png" alt="Bulbasaur">
        <img src="static/images/psyduck.png" alt="Charmander">
        <img src="static/images/squirtle.png" alt="Squirtle">
    </div>
</body>

</html>
