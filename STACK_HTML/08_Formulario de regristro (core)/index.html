<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>


</head>

<body>
    <h1>Crear una cuenta de Discord</h1>

    <form action="regristro" method="post"></form> <div>
        <label for="nombre">Tu nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
        </div>


        <div>
            <label for="correo electronico">Correo electrónico:</label>
            <input type="text" id="correo" name="correo" placeholder="Ingresa tu correo">
        </div>

        <div>
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" placeholder="Ingresa tu contraseña" />
        </div>

        <div>
            <label for="confirmar contraseña"> confirmar Contraseña:</label>
            <input type="password" id="contraseña" name=" confirmar contraseña" placeholder="Ingresa tu contraseña" />
        </div>

        <div>
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        </div>

        <div>
            <label>Genero:</label>
            <input type="radio" id="genero" name="genero" value="masculino">
            <label for="masculino"></label>masculino</label>
            <input type="radio" id="femenino" name="femenino" value="femenino">
            <label for="femenino">femenino</label>
            <input type="radio" id="prefiero no decirlo" name="prefiero no decirlo " value="prefiero no decirlo">
            <label for="prefiero no decirlo">prefiero no decirlo</label>
        </div>

        <div>

            <label for="Descripcion sobre ti">Descripcion sobre ti:</label>
            <br>
            <textarea id="Descripcion sobre ti" name="Descripcion sobre ti" rows="4" cols="30"></textarea>
        </div>

        <div>
            <label for="Seleccionar">Seleccionar tus intereses</label><br>
            <select id="Seleccionar" name="Seleccionar"> 
                <option value="Musica">Musica</option>
                <option value="Peliculas">Peliculas</option>
                <option value="Tecnologia">Tecnologia</option>
            </select><br><br>
        </div>

        <div>
            <input type="checkbox" id="acepto" name="acepto"> <label for="acepto">al regristrarse aceptas los <a
                href="#">terminos y condiciones</a> de Discord<label></label><br><br>
        </div>

        <div>
            <input type="submit" value="regristrarse"> </div>
    </form>
</body>

</html
